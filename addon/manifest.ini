name = "paddleOcr"
summary = "Paddle OCR"
description = """Recognizes text on the screen with PaddleOCR models, like Windows OCR (NVDA+R) but with a different engine."""
author = "fdrv161"
url = "https://github.com/fdrv161/nvda-paddle-ocr"
version = "1.0.6"
changelog = """* The setting is now called "Recognition mode", and its first option "Follow NVDA language".
* With NVDA in Serbian the Latin mode is now the default, because NVDA's Serbian translation is in Latin script. The Cyrillic mode is the default with NVDA in Russian, Ukrainian, Belarusian, Bulgarian, Macedonian, Kyrgyz and Mongolian.
* The add-on package is smaller: test files and type hints of the bundled libraries are no longer included.
* Recognition uses much less memory: on a full-width console about 290 MB instead of up to 800 MB, on ordinary screens about 280 MB instead of 400–500 MB, on 4K screens about three times less. Speed and accuracy are the same.
* The help has been rewritten."""
minimumNVDAVersion = "2026.3.0"
lastTestedNVDAVersion = "2026.3.0"
docFileName = "readme.html"
