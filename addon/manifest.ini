name = "paddleOcr"
summary = "Paddle OCR"
description = """Recognizes text on the screen with PaddleOCR models, like Windows OCR (NVDA+R) but with a different engine."""
author = "fdrv161"
url = "https://github.com/fdrv161/nvda-paddle-ocr"
version = "1.0.6"
changelog = """* The setting is now called "Recognition mode", and its first option "Follow NVDA language".
* With NVDA in Serbian the Latin mode is now the default, because NVDA's Serbian translation is in Latin script. The Cyrillic mode is the default with NVDA in Russian, Ukrainian, Belarusian, Bulgarian, Macedonian, Kyrgyz and Mongolian.
* The add-on package is smaller: test files and type hints of the bundled libraries are no longer included.
* Recognition uses much less memory.
* Pressing the recognition command again while a recognition is running no longer starts it over: the add-on says "Recognition in progress". If a recognition takes longer than 30 seconds, the next press starts a new one.
* The help has been rewritten.
* If the Microsoft Visual C++ Redistributable x64 package is missing, the add-on now says so and tells how to fix it, instead of only "Recognition failed".
* Usage events of the bundled ONNX Runtime library for Microsoft are turned off.
* Programs started from NVDA no longer get an extra folder from OpenCV in their PATH.
* In a result window with periodic refresh, the recognition command now says "Already in a content recognition result", and right after closing it a new recognition starts without "Recognition in progress".
* The NVDA log at the "debug" level shows the versions and folders of numpy, OpenCV and ONNX Runtime; a warning is logged if they were loaded from another add-on."""
minimumNVDAVersion = "2026.3.0"
lastTestedNVDAVersion = "2026.3.0"
docFileName = "readme.html"
