name = "paddleOcr"
summary = "Paddle OCR"
description = """Recognizes text on the screen with PaddleOCR models, like Windows OCR (NVDA+R) but with a different engine."""
author = "fdrv161"
url = "https://github.com/fdrv161/nvda-paddle-ocr"
version = "1.0.5"
changelog = """* Cyrillic mode uses a new model: fewer errors, especially in lines that mix Cyrillic and Latin (file names, plugin names); it also reads Serbian, Macedonian, Kazakh and other Cyrillic languages.
* Small objects (a button, a label) are recognized much more reliably: text near the edge is no longer lost.
* Less memory and fewer threads inside NVDA; recognition is slightly faster."""
minimumNVDAVersion = "2026.3.0"
lastTestedNVDAVersion = "2026.3.0"
docFileName = "readme.html"
