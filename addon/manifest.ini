name = "paddleOcr"
summary = "Paddle OCR"
description = """Recognizes text on the screen with PaddleOCR models, like Windows OCR (NVDA+R) but with a different engine."""
author = "fdrv161"
url = "https://github.com/fdrv161/nvda-paddle-ocr"
version = "1.0.6"
changelog = """* The setting is now called "Recognition mode".
* With NVDA in Serbian, the Latin mode is now the default.
* Recognition uses much less memory, and the add-on package is smaller.
* Pressing the recognition command during a recognition no longer starts it over.
* If the Microsoft Visual C++ Redistributable is missing, the add-on now says so.
* Fixed a wrong "Recognition in progress" message around the result window with periodic refresh.
* The help has been rewritten."""
minimumNVDAVersion = "2026.3.0"
lastTestedNVDAVersion = "2026.3.0"
docFileName = "readme.html"
