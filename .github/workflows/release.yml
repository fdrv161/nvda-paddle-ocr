# Builds the add-on on GitHub.
# A tag like v1.2.3 → tests, .nvda-addon build and a release with that file.
# Manual run (Actions tab → Release → Run workflow): build only, the file goes to the run artifacts.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    # The scripts print in Russian, and the Windows console on GitHub is cp1252: without UTF-8 print fails.
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      # NVDA 2026.3 runs Python 3.13, so the engine is tested on it.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Version in manifest.ini matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = (Select-String -Path addon/manifest.ini -Pattern '^version\s*=\s*"?([^"\s]+)').Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match version $v in addon/manifest.ini" }

      - name: Models
        run: python tools/fetch_models.py det_v6_tiny rec_v6_small rec_cyrillic_v5

      - name: Libraries
        run: python tools/fetch_libs.py

      - name: Tests
        run: |
          python -m pip install --quiet pytest numpy==2.5.3 opencv-python-headless==5.0.0.93 onnxruntime==1.30.0
          python -m pytest tests -q

      - name: Build
        run: |
          python -m pip install --quiet markdown
          python tools/build_addon.py

      # Release text is the manifest changelog (what NVDA shows as "What's new").
      - name: Release notes
        shell: python
        run: |
          import re
          text = open("addon/manifest.ini", encoding="utf-8").read()
          m = re.search(r'^changelog\s*=\s*"{3}(.*?)"{3}', text, re.MULTILINE | re.DOTALL)
          notes = m.group(1).strip() + "\n" if m else ""
          open("release_notes.md", "w", encoding="utf-8").write(notes)

      - uses: actions/upload-artifact@v4
        with:
          name: nvda-addon
          path: "*.nvda-addon"

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.nvda-addon"
          body_path: release_notes.md
