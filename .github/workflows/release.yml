# Сборка дополнения на GitHub.
# Тег вида v1.2.3 → тесты, сборка .nvda-addon и релиз с этим файлом.
# Ручной запуск (вкладка Actions → Release → Run workflow) — только сборка, файл в артефактах запуска.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # NVDA 2026.3 работает на Python 3.13: на нём и проверяем движок.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Версия в manifest.ini совпадает с тегом
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = (Select-String -Path addon/manifest.ini -Pattern '^version\s*=\s*(\S+)').Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Тег ${{ github.ref_name }} не совпадает с версией $v в addon/manifest.ini" }

      - name: Модели
        run: python tools/fetch_models.py det_v6_tiny rec_v6_small rec_eslav_v5

      - name: Библиотеки
        run: python tools/fetch_libs.py

      - name: Тесты
        run: |
          python -m pip install --quiet pytest numpy==2.5.3 opencv-python-headless==5.0.0.93 onnxruntime==1.30.0
          python -m pytest tests -q

      - name: Сборка
        run: python tools/build_addon.py

      - uses: actions/upload-artifact@v4
        with:
          name: nvda-addon
          path: "*.nvda-addon"

      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.nvda-addon"
          generate_release_notes: true
